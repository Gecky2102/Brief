name: Release

# Si attiva pubblicando un tag di versione: `git tag v0.2.0 && git push --tags`
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # whisper.cpp si compila con cmake, presente sui runner Windows ma non
      # sempre su quelli macOS.
      - name: Installa cmake
        if: startsWith(matrix.platform, 'macos')
        run: brew install cmake || true

      - name: Installa le dipendenze
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Brief ${{ github.ref_name }}"
          releaseBody: "Trascina Brief nella cartella Applicazioni. Gli aggiornamenti successivi arrivano dall'app stessa."
          releaseDraft: false
          # Una piattaforma che fallisce non deve impedire la pubblicazione
          # delle altre.
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
